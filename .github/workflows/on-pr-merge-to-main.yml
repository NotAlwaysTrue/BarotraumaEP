name: OnPRMergetoMain

on:
  workflow_dispatch:
    inputs:
      include_workshop:
        description: Also build standalone Workshop server archives
        type: boolean
        default: false
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  merge:
    name: Check for merged PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Find the PR that updated master
        id: pr
        if: github.event_name == 'push' && !github.event.deleted && !github.event.forced
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" | jq -r \
              --arg branch "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
              'map(select(.base.ref == $branch and .merged_at != null and .merge_commit_sha == $sha)) | first | .number // empty')
            if [[ -n "$number" ]]; then
              echo "number=$number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          echo "No merged pull request updated master to $GITHUB_SHA."

  build:
    name: Build
    needs: merge
    if: github.event_name == 'workflow_dispatch' || needs.merge.outputs.pr_number != ''
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ github.sha }}
      configuration: ${{ github.event_name == 'workflow_dispatch' && 'Debug' || 'Release' }}

  package:
    name: Package
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      target: ${{ github.sha }}
      configuration: ${{ github.event_name == 'workflow_dispatch' && 'Debug' || 'Release' }}
      include-workshop: ${{ github.event_name == 'push' || inputs.include_workshop == true }}

  release:
    name: Release
    needs: [merge, package]
    concurrency:
      group: release-${{ github.event_name == 'workflow_dispatch' && 'debug' || 'release' }}
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      target: ${{ github.sha }}
      tag: ${{ github.event_name == 'workflow_dispatch' && 'Debug' || 'Release' }}
      prerelease: ${{ github.event_name == 'workflow_dispatch' }}
      description: >-
        ${{ github.event_name == 'workflow_dispatch' && format('Manual test build of commit {0}.', github.sha) || format('Automated build of master commit {0} from PR #{1}.', github.sha, needs.merge.outputs.pr_number) }}
