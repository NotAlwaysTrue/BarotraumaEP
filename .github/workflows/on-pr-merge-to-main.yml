name: OnPRMergetoMain

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [closed]

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      configuration: ${{ github.event_name == 'workflow_dispatch' && 'Debug' || 'Release' }}

  package:
    name: Package
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      target: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      configuration: ${{ github.event_name == 'workflow_dispatch' && 'Debug' || 'Release' }}
      include-workshop: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}

  release:
    name: Release
    needs: package
    concurrency:
      group: release-${{ github.event_name == 'workflow_dispatch' && 'debug' || 'release' }}
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      target: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      tag: ${{ github.event_name == 'workflow_dispatch' && 'Debug' || 'Release' }}
      prerelease: ${{ github.event_name == 'workflow_dispatch' }}
      description: >-
        ${{ github.event_name == 'workflow_dispatch' && format('Manual test build of commit {0}.', github.sha) || format('Automated build of merge commit {0} from PR #{1}.', github.event.pull_request.merge_commit_sha, github.event.pull_request.number) }}
