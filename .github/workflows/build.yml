name: Build

on:
  workflow_call:
    inputs:
      target:
        description: Commit to build
        required: true
        type: string
      configuration:
        description: Build configuration
        required: true
        type: string
      include-workshop:
        description: Generate publicized references for the Workshop server archive
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ inputs.configuration }}, ${{ matrix.platform.name }}, ${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: windows, project: Windows, runtime: win-x64 }
          - { name: linux, project: Linux, runtime: linux-x64 }
          - { name: macos, project: Mac, runtime: osx-x64 }
        component: [Client, Server]
    steps:
      - name: Check out build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build binaries
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        shell: bash
        run: |
          set -euo pipefail
          publish_args=(
            --configuration "$BUILD_CONFIGURATION" --runtime "${{ matrix.platform.runtime }}"
            --self-contained -p:Platform=x64 --output "$RUNNER_TEMP/publish"
          )
          # The client starts a local DedicatedServer when hosting a game.
          if [[ "${{ matrix.component }}" == "Client" ]]; then
            dotnet publish "Barotrauma/BarotraumaServer/${{ matrix.platform.project }}Server.csproj" "${publish_args[@]}"
          fi
          dotnet publish "Barotrauma/Barotrauma${{ matrix.component }}/${{ matrix.platform.project }}${{ matrix.component }}.csproj" \
            "${publish_args[@]}"

      - name: Generate Workshop server references
        if: inputs.include-workshop && matrix.component == 'Server'
        shell: bash
        run: |
          dotnet msbuild .github/scripts/publicize-server.proj -restore -target:PublicizeServer \
            -p:ServerPublishDir="$RUNNER_TEMP/publish" \
            -p:BaseIntermediateOutputPath="$RUNNER_TEMP/publicizer-obj/"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.configuration }}-${{ matrix.platform.name }}-${{ matrix.component }}-x64
          path: ${{ runner.temp }}/publish/
          if-no-files-found: error
          retention-days: 1
