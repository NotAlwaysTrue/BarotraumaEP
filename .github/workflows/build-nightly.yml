name: BuildNightly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-nightly
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve Dev commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: echo "sha=$(gh api "repos/$GH_REPO/commits/Dev" --jq .sha)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.configuration }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ needs.resolve.outputs.sha }}
      configuration: ${{ matrix.configuration }}

  package:
    name: Package (${{ matrix.configuration }})
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    uses: ./.github/workflows/package.yml
    with:
      target: ${{ needs.resolve.outputs.sha }}
      configuration: ${{ matrix.configuration }}
      include-workshop: false

  release:
    name: Release
    needs: [resolve, package]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      target: ${{ needs.resolve.outputs.sha }}
      tag: Nightly
      prerelease: true
      description: Release and Debug builds of Dev commit ${{ needs.resolve.outputs.sha }}.
